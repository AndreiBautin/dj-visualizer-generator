<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#05080b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f6f9"
      media="(prefers-color-scheme: light)"
    />
    <title>DJ Visualizer Generator</title>
    <meta
      name="description"
      content="Turn a DJ mix and cover art into a spinning-record MP4. Upload, preview the exact look, and download the video."
    />
    <!-- Link previews. og:image must be absolute for most scrapers, so it names the public demo;
         a self-hosted instance would still show the demo's card, which is harmless. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DJ Visualizer Generator" />
    <meta
      property="og:description"
      content="Turn a DJ mix and cover art into a spinning-record MP4."
    />
    <meta property="og:image" content="https://dj-visualizer.onrender.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
