server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 2GB audio uploads pass through this proxy on their way to the API.
    client_max_body_size 2200m;

    # nginx's default 60s inactivity timeouts (client_body_timeout, send_timeout) can reset a
    # connection mid-transfer if a multi-GB upload or multi-hour video download stalls briefly
    # (slow disk I/O, a slow client connection) without any data moving for that long - the
    # request/response just dies with no error the app can show. Raised for this app's explicit
    # long-transfer use case; these only matter if a stall actually happens, not for overall
    # transfer duration, since any successful read/write resets the timer.
    client_body_timeout 300s;
    send_timeout 300s;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
