name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Restore
        run: dotnet restore backend/DjVisualizer.sln

      - name: Build
        run: dotnet build backend/DjVisualizer.sln --no-restore -c Release

      - name: Test
        run: dotnet test backend/DjVisualizer.sln --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f docker/Dockerfile.api -t djvisualizer-api:ci .

      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t djvisualizer-worker:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t djvisualizer-frontend:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
