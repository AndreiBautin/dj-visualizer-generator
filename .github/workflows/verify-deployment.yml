name: Verify deployment
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-deployment
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify expected revision and real media output
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$PRODUCTION_URL" || { echo '::error::Set PRODUCTION_URL to enable live verification'; exit 1; }
          bash scripts/verify-deployment.sh "$PRODUCTION_URL" "$EXPECTED_SHA"
